version: '3.8'

services:
  postgres:

    image: postgres:15-alpine
    container_name: pom_db

    environment:
      POSTGRES_DB: pom_db
      POSTGRES_USER: pom
      POSTGRES_PASSWORD: postgres


    ports:
     - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql-scripts/pom:/docker-entrypoint-initdb.d

  oracle:

    image: gvenzl/oracle-xe:21-slim

    container_name: gru_db

    environment:
      ORACLE_PASSWORD: gru_password_sys

      APP_USER: GRU
      APP_USER_PASSWORD: gru_password

    ports:
      - "1521:1521"

    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./sql-scripts/gru:/container-entrypoint-initdb.d


volumes:
  postgres_data:
  oracle_data: